name = "voxcel-city"
main = "src/index.ts"
compatibility_date = "2026-07-18"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "voxcel-city.acertak.app", custom_domain = true }
]

[secrets]
required = ["APP_LOGIN_USERNAME", "APP_LOGIN_PASSWORD", "APP_LOGIN_SESSION_SECRET"]

[assets]
directory = ".cloudflare-assets"
binding = "ASSETS"
html_handling = "none"
run_worker_first = true
